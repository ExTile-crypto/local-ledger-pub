<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Local Ledger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M9 22V10m0 12h14M13 18l4-4 3 3 4-5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/style.css?v=19">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--series-1)"/><path d="M9 22V10m0 12h14M13 18l4-4 3 3 4-5" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Local Ledger</span>
    </div>
    <nav id="tabs" class="nav" aria-label="Sections"></nav>
    <div class="util">
      <button id="llm-pill" class="pill" title="Model status - click for settings">Checking model…</button>
      <button id="hide-btn" class="btn sm" title="Show every amount as **** (for screen sharing)">Hide amounts</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="bottom" class="bottom" aria-label="Sections"></nav>

  <div id="sheet" class="sheet" role="dialog" aria-label="All sections"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>
  <script src="/static/app.js?v=19"></script>

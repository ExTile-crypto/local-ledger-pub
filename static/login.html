<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Local Ledger</title>
  <link rel="stylesheet" href="/static/style.css?v=19">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; grid-template-columns: 1fr; padding: 16px; }
    .box { width: min(360px, 100%); }
    .box .brand { padding: 0 0 14px; font-size: 17px; }
    .box input { width: 100%; }
    .box .btn { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card box" id="f">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--series-1)"/><path d="M9 22V10m0 12h14M13 18l4-4 3 3 4-5" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Local Ledger</span>
    </div>
    <label class="f">Password
      <input type="password" id="pw" autocomplete="current-password" autofocus required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="small" id="msg" role="alert" style="color:var(--critical);margin:10px 0 0;min-height:18px"></p>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg"); msg.textContent = "";
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
        if (r.ok) { location.href = "/"; return; }
        msg.textContent = (await r.json()).detail || "Could not sign in.";
      } catch { msg.textContent = "The server did not answer."; }
    });
  </script>
</body>
</html>
